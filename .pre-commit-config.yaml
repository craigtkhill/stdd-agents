repos:
  - repo: local
    hooks:
      - id: check-skill-length
        name: check skill length
        entry: scripts/check-skill-length.sh
        language: script
        files: SKILL\.md$

      - id: check-spec-ids
        name: check spec requirement ID uniqueness
        entry: scripts/check-spec-ids.sh
        language: script
        files: spec\.yaml$
        pass_filenames: false
